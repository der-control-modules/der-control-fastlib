name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff linter
        run: |
          ruff check .

      - name: Run ruff format check
        run: |
          ruff format --check --diff src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install -e .[dev]
          echo "VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
        # The venv lives outside the checkout, not at ./.venv: a repo-root
        # .venv is how the legacy BACnet integration tests in tests/ detect
        # a real local VOLTTRON dev setup and attempt to launch it; creating
        # one here would flip those tests from skipped to failing.

      - name: Run linting
        run: |
          make RUFF="$VENV/bin/ruff" lint

      - name: Run tests
        run: |
          make PYTEST="$VENV/bin/pytest" test

      - name: Test build
        run: |
          make PYTHON="$VENV/bin/python" build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # setuptools>=83 clears PYSEC-2026-3447; venv seeds an older
          # setuptools via ensurepip and `pip install --upgrade pip` alone
          # does not touch it, so pip-audit flags the seeded version.
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip "setuptools>=83"
          "$RUNNER_TEMP/venv/bin/pip" install -e .[dev]
          echo "VENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - name: Run security scans (standard mode)
        run: |
          make PIP_AUDIT="$VENV/bin/pip-audit" BANDIT="$VENV/bin/bandit" security  # Only fails on MEDIUM/HIGH/CRITICAL severity
        if: github.ref != 'refs/heads/main'

      - name: Run security scans (strict mode for main branch)
        run: |
          make PIP_AUDIT="$VENV/bin/pip-audit" BANDIT="$VENV/bin/bandit" security-strict  # Zero tolerance for releases
        if: github.ref == 'refs/heads/main'

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
