# Pre-commit hooks configuration
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/settings\.json$  # VSCode supports JSONC (JSON with Comments)
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      # Run the linter, excluding tests to avoid line-length and style noise
      - id: ruff
        args: [--fix]
        exclude: ^tests/
      # Run the formatter but exclude test files to avoid assert reformatting
      - id: ruff-format
        exclude: ^tests/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        exclude: ^(tests|dev\.py|test_rpc\.py|dev_new\.py|new_init_project\.py|debug_rpc\.py|scoop-files-for-model\.py)
        args: [-s, "B101,B110,B307,B404,B603,B607"]
