[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aems"
description = "Agent Energy Management System"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "C. Allwardt", email = "3979063+craig8@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Here's how to specify dependencies in pyproject.toml format:
dependencies = [
    "fastapi~=0.119.1",
    "uvicorn~=0.38.0",
    "websocket-client~=1.9.0",
    "websockets~=15.0.1",
    "gevent~=25.9.1",
    "httpx~=0.28.1",
    "pydantic~=2.12.3",
    "pydantic_core~=2.41.4",
    "PyYAML==6.0.3",
    "watchdog==6.0.0",
    "watchgod==0.8.2"
]
dynamic = ["version"]

[project.optional-dependencies]
# Dependencies for development
dev = [
    "black>=24.0.0",
    "pylint>=4.0.8",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "tomli>=1.2.0; python_version<'3.11'",
]
# # Dependencies for documentation
# docs = [
#     "sphinx>=6.1.3",
#     "sphinx-rtd-theme>=1.2.0",
# ]
# # Dependencies for the server only
# server = [
#     "fastapi>=0.95.0",
#     "uvicorn>=0.21.1",
#     "pydantic>=1.10.7",
# ]
# # Dependencies for the client only
# client = [
#     "websocket-client>=1.5.1",
#     "gevent>=22.10.2",
#     "httpx>=0.24.0",
# ]

[project.scripts]
aems-server = "aems.server.fastapi_message_bus:_main"

# [project.urls]
# Documentation = "https://github.com/yourusername/aems"
# Source = "https://github.com/yourusername/aems"
# Issues = "https://github.com/yourusername/aems/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Uses git tags for versioning

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
skip-string-normalization = false

[tool.flake8]
max-line-length = 100
# Ignore codes that conflict with Black formatter
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
    "E501",  # line too long (handled by Black)
    "W504",  # line break after binary operator
    "E231",  # missing whitespace after ','
    "E226",  # missing whitespace around arithmetic operator
    "E241",  # multiple spaces after ','
    "E242",  # multiple spaces after operator
    "W291",  # trailing whitespace (handled by Black)
    "W293",  # blank line contains whitespace (handled by Black)
]
# Enable specific checks that complement Pylint
select = [
    "F",     # Pyflakes errors
    "E9",    # Runtime errors
    "W6",    # Warnings
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "trailing-whitespace",
    "line-too-long",           # Handled by Black
    "missing-final-newline",   # Handled by Black
    "multiple-statements",     # Can conflict with Black's formatting
    "too-many-arguments",      # Style preference
    "too-few-public-methods",  # Style preference
]

# Enable useful checks that complement flake8
enable = [
    "useless-suppression",
]

[tool.pylint.basic]
# Allow single-character variable names in specific contexts
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "ws"]

[tool.pylint.design]
# Reasonable limits that won't conflict with practical code
max-args = 10
max-locals = 20
max-branches = 15

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
