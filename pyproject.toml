[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aems"
description = "Agent Energy Management System"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {text = "Apache-2.0"}
authors = [
    {name = "C. Allwardt", email = "3979063+craig8@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Here's how to specify dependencies in pyproject.toml format:
dependencies = [
    "fastapi~=0.119.1",
    "uvicorn~=0.38.0",
    "websocket-client~=1.9.0",
    "websockets~=15.0.1",
    "gevent~=25.9.1",
    "httpx~=0.28.1",
    "pydantic~=2.12.3",
    "pydantic_core~=2.41.4",
    "PyJWT~=2.8.0",
    "python-multipart~=0.0.12",
    "PyYAML==6.0.3",
    "watchdog==6.0.0",
    "watchgod==0.8.2",
    "volttron-core>=2.0.0rc16"
]
dynamic = ["version"]

[project.optional-dependencies]
# Dependencies for development
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.0",
    "ruff>=0.8.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "tomli>=1.2.0; python_version<'3.11'",
    "pip-audit>=2.6.0",
    "bandit>=1.7.0",
    "click>=8.0.0",
    "pre-commit>=3.0.0",
]
# # Dependencies for documentation
# docs = [
#     "sphinx>=6.1.3",
#     "sphinx-rtd-theme>=1.2.0",
# ]
# # Dependencies for the server only
# server = [
#     "fastapi>=0.95.0",
#     "uvicorn>=0.21.1",
#     "pydantic>=1.10.7",
# ]
# # Dependencies for the client only
# client = [
#     "websocket-client>=1.5.1",
#     "gevent>=22.10.2",
#     "httpx>=0.24.0",
# ]

[project.scripts]
aems-server = "aems.server.fastapi_message_bus:_main"

# [project.urls]
# Documentation = "https://github.com/yourusername/aems"
# Source = "https://github.com/yourusername/aems"
# Issues = "https://github.com/yourusername/aems/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Uses git tags for versioning

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 120
# Ignore codes that conflict with Black formatter and common issues
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
    "E501",  # line too long (handled by Black)
    "W504",  # line break after binary operator
    "E231",  # missing whitespace after ','
    "E226",  # missing whitespace around arithmetic operator
    "E241",  # multiple spaces after ','
    "E402",  # module level import not at top of file (tests may need this)
    "F841",  # local variable assigned but never used (common in tests)
]
# Enable specific checks that complement Pylint
select = [
    "F",     # Pyflakes errors
    "E9",    # Runtime errors
    "W6",    # Warnings
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "trailing-whitespace",
    "line-too-long",           # Handled by Black
    "missing-final-newline",   # Handled by Black
    "multiple-statements",     # Can conflict with Black's formatting
    "too-many-arguments",      # Style preference
    "too-few-public-methods",  # Style preference
    "missing-module-docstring", # Test files don't need module docstrings
    "missing-class-docstring",  # Test classes don't need docstrings
    "missing-function-docstring", # Test functions are self-documenting
    "import-error",            # Expected in test environments
    "unused-import",           # Many test imports are conditional
    "unused-variable",         # Common in test fixtures
    "unused-argument",         # Common in test fixtures and callbacks
    "broad-exception-caught",  # Acceptable in tests and error handling
    "too-many-statements",     # Test methods can be long
    "too-many-branches",       # Test methods can have many conditions
    "too-many-locals",         # Test methods can have many variables
    "too-many-instance-attributes", # Data classes and test classes
    "duplicate-code",          # Test files often have similar patterns
    "wrong-import-position",   # Tests may import conditionally
    "wrong-import-order",      # isort handles import ordering
    "redefined-outer-name",    # Common with pytest fixtures
    "reimported",              # Tests may reimport for clarity
    "import-outside-toplevel", # Tests may import conditionally
    "no-else-return",          # Style preference
    "unnecessary-pass",        # Placeholder code
    "unnecessary-comprehension", # Style preference
    "consider-using-f-string", # Backwards compatibility
    "super-with-arguments",    # Backwards compatibility
    "useless-parent-delegation", # Sometimes needed for clarity
    "attribute-defined-outside-init", # Common in tests
    "protected-access",        # Tests need to access internals
    "inconsistent-return-statements", # Complex logic may need this
    "fixme",                   # TODO comments are acceptable
    "raise-missing-from",      # Backwards compatibility
    "logging-fstring-interpolation", # Performance not critical in most cases
    "singleton-comparison",    # Sometimes needed for clarity
    "bad-except-order",        # Backwards compatibility
    "unspecified-encoding",    # Default encoding is often acceptable
    "access-member-before-definition", # Complex initialization patterns
    "assignment-from-no-return", # Library compatibility issues
    "return-in-finally",       # Complex error handling
    "lost-exception",          # Complex error handling
    "broad-exception-raised",  # Generic exceptions acceptable in some contexts
    "consider-iterating-dictionary", # Style preference
    "too-many-lines",          # Large modules are sometimes necessary
    "too-many-return-statements", # Complex logic may need many returns
    "subprocess-run-check",    # Dev scripts don't always need error checking
    "too-many-nested-blocks",  # Complex logic in server code
    "invalid-name",            # Some names are dictated by external APIs
    "no-self-argument",        # Descriptors and decorators may not use self
]# Enable useful checks that complement flake8
enable = [
    "useless-suppression",
]

[tool.pylint.basic]
# Allow single-character variable names in specific contexts
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "ws"]

[tool.pylint.design]
# Reasonable limits that won't conflict with practical code
max-args = 15
max-locals = 25
max-branches = 20
max-statements = 60
max-attributes = 15

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601", "B404", "B603", "B607", "B602", "B110"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Also enable:
# - pycodestyle warnings (`W`)
# - isort (`I`)
# - pydocstyle (`D`)
# - pyupgrade (`UP`) - upgrade syntax for newer Python versions
# - flake8-bugbear (`B`) - additional bug and design problems
# - flake8-simplify (`SIM`) - simplify code
# - flake8-comprehensions (`C4`) - improve comprehensions
# - flake8-pie (`PIE`) - miscellaneous lints
# - flake8-type-checking (`TCH`) - type checking improvements
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstrings)
]

# Ignore specific rules that conflict with our coding standards or Black
ignore = [
    "E203",   # whitespace before ':' (conflicts with Black)
    "E501",   # line too long (handled by Black and line-length setting)
    "D100",   # Missing docstring in public module (not needed for all modules)
    "D101",   # Missing docstring in public class (not needed for test classes)
    "D102",   # Missing docstring in public method (not needed for test methods)
    "D103",   # Missing docstring in public function (not needed for test functions)
    "D104",   # Missing docstring in public package (not needed for __init__.py)
    "D105",   # Missing docstring in magic method (not always needed)
    "D107",   # Missing docstring in __init__ (not always needed)
    "D200",   # One-line docstring should fit on one line
    "D205",   # 1 blank line required between summary line and description (style preference)
    "D212",   # Multi-line docstring summary should start at the first line
    "D401",   # First line should be in imperative mood (style preference)
    "B008",   # Do not perform function calls in argument defaults (common in FastAPI)
    "B017",   # Do not assert blind exception (acceptable in tests)
    "B904",   # raise ... from err (backward compatibility)
    "UP007",  # Use X | Y for unions (want to maintain Python 3.10 compatibility)
    "TC002",  # Move third-party imports into type-checking blocks (can break runtime)
    "TC003",  # Move standard library imports into type-checking blocks (can break runtime)
    "SIM102", # Use single if statement (style preference)
    "SIM108", # Use ternary operator (style preference)
    "PIE790", # Unnecessary pass statement (sometimes needed for clarity)
    "E402",   # Module level import not at top (gevent monkey patching requires this)
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use more relaxed rules
"tests/**/*.py" = [
    "D",     # Don't require docstrings in tests
    "SIM",   # Don't simplify test code (clarity over brevity)
    "TCH",   # Don't enforce type checking imports in tests
    "B011",  # Don't warn about assert False in tests
    "PIE804", # Don't require unnecessary dict kwargs
    "PIE800", # Don't warn about unnecessary spread
]
# Allow more flexibility in __init__ files
"**/__init__.py" = [
    "D104",  # Don't require docstring in __init__.py
    "F401",  # Allow "unused" imports (they're often re-exports)
    "F403",  # Allow star imports in __init__.py
]
# Scripts and examples can be more flexible
"examples/**/*.py" = ["D", "T201", "T203"]  # Allow print statements
"scripts/**/*.py" = ["D", "T201", "T203"]   # Allow print statements

[tool.ruff.lint.isort]
known-first-party = ["aems"]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # Use NumPy docstring style
